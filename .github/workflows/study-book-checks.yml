name: Study Book Integrity
on:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/study-book-checks.yml'
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/study-book-checks.yml'
jobs:
  content-and-js:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify content freeze and base CSS
        run: python3 tests/verify_study_book.py index.html
      - name: Extract and syntax-check site JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,re.DOTALL|re.IGNORECASE)
          assert len(scripts)>=3, 'Missing embedded scripts or runtime'
          Path('/tmp/sunday-runtime.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/sunday-runtime.js

  browser-acceptance:
    needs: content-and-js
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser + PDF verification dependencies
        run: |
          python -m pip install playwright pypdf
          python -m playwright install --with-deps chromium
      - name: Test exact PR site in real Chromium
        run: python tests/portal_browser_qa.py
      - name: Archive desktop/mobile screenshots and printed PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-browser-qa
          path: qa-artifacts/
          if-no-files-found: warn
